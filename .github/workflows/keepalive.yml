name: Keep bot awake

# Render bepul instansiyasi 15 daqiqa harakatsizlikdan keyin uxlaydi va keyingi
# ochilish 1-4 daqiqa kutishga aylanadi. Bu ping servisni uyg'oq ushlab turadi.
# URL o'zgarsa: repo Settings -> Secrets and variables -> Actions -> Variables
# bo'limida BOT_URL ni o'rnating (masalan https://mening-botim.onrender.com).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.BOT_URL || 'https://shashka-bot-aemd.onrender.com' }}
        run: |
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-delay 15 "$URL/health" || true)
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
